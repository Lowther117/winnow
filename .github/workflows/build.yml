name: Build

# Compiles Winnow on a clean Windows machine with the same build-exe.bat you
# run at home, runs the exe's self-test, and keeps the exe as a download.
on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build-exe.bat
        shell: cmd
        run: call build-exe.bat x64
      - name: Build log
        if: always()
        shell: pwsh
        run: if (Test-Path build-win-log.txt) { Get-Content build-win-log.txt }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Winnow-win-x64
          path: |
            dist/Winnow.exe
            dist/winnow-selftest.txt
          if-no-files-found: error
