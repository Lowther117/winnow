name: Build

# Compiles Winnow on a clean Windows machine with the same build-exe.bat you
# run at home, runs the exe's self-test, and keeps the exe as a download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build-exe.bat
        shell: cmd
        run: call build-exe.bat x64
      - name: Build log
        if: always()
        shell: pwsh
        run: if (Test-Path build-win-log.txt) { Get-Content build-win-log.txt }
      # Keep the latest build log on a 'ci-log' branch so it can be read without a browser.
      - name: Publish build log
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build-win-log.txt)) { exit 0 }
          $log = Get-Content build-win-log.txt -Raw
          $tmp = Join-Path $env:RUNNER_TEMP 'cilog'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp 'build-win-log.txt') -Value $log -Encoding utf8
          if (Test-Path dist/winnow-selftest.txt) { Copy-Item dist/winnow-selftest.txt $tmp }
          Set-Location $tmp
          git init -q -b ci-log
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "Build log for $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Winnow-win-x64
          path: |
            dist/Winnow.exe
            dist/winnow-selftest.txt
          if-no-files-found: error
