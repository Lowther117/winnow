name: Build

# Compiles Winnow on a clean Windows machine with the same build-exe.bat you
# run at home, runs the exe's self-test, and keeps the exe as a download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time; a newer push cancels the older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: build-exe.bat
        shell: cmd
        run: call build-exe.bat x64
      # Open every page on a real desktop session, screenshot it, and fail on any runtime fault.
      - name: UI test
        if: success()
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Winnow.exe -ArgumentList 'uitest' -PassThru
          $null = $p.Handle   # keep the handle so ExitCode is readable after exit
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Write-Host 'UI test timed out'; exit 1 }
          if (Test-Path dist\winnow-uitest.txt) { Get-Content dist\winnow-uitest.txt } else { Write-Host 'no report'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "UI test exited with code $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path dist\winnow-uitest.txt -SimpleMatch 'RESULT: all pages opened' -Quiet)) { exit 1 }
      # The UI test report and page screenshots, kept whether the test passed or not.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Winnow-uitest
          path: |
            dist/winnow-uitest.txt
            dist/uitest-*.png
            dist/winnow-crash.log
          if-no-files-found: ignore
      - name: Build log
        if: always()
        shell: pwsh
        run: if (Test-Path build-win-log.txt) { Get-Content build-win-log.txt }
      # Keep the latest build log on a 'ci-log' branch so it can be read without a browser.
      - name: Publish build log
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build-win-log.txt)) { exit 0 }
          $log = Get-Content build-win-log.txt -Raw
          $tmp = Join-Path $env:RUNNER_TEMP 'cilog'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Set-Content -Path (Join-Path $tmp 'build-win-log.txt') -Value $log -Encoding utf8
          foreach ($f in 'winnow-selftest.txt','winnow-uitest.txt','winnow-crash.log','winnow-log.txt') { if (Test-Path "dist/$f") { Copy-Item "dist/$f" $tmp } }
          Get-ChildItem dist -Filter 'uitest-*.png' -ErrorAction SilentlyContinue | Copy-Item -Destination $tmp
          Set-Location $tmp
          git init -q -b ci-log
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add -A
          git commit -q -m "Build log for $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Winnow-win-x64
          path: |
            dist/Winnow.exe
            dist/winnow-selftest.txt
          if-no-files-found: error
